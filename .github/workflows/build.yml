name: Build

# Compila ezyPlayer per a Windows, macOS i Linux i puja els instal·ladors com a
# artefactes. Sense signatura (per a testeig): a macOS cal obrir l'app amb
# botó dret -> Obrir la primera vegada (Gatekeeper).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # CI compila amb el motor cpal multiplataforma (`native`), NO amb `asio`:
          # ASIO no existeix a Mac i requereix l'ASIO SDK + MSVC (no als runners).
          # El CLI de Tauri v2 NO té flag `--no-default-features`; el passem al
          # runner (cargo) després de `--` perquè desactivi el default `asio`.
          - platform: macos-latest
            args: "--target universal-apple-darwin --features native -- --no-default-features"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: "--features native -- --no-default-features"
            rust-targets: ""
          # Linux: 22.04 (glibc més antiga → el .deb funciona també a 24.04).
          # Només .deb: l'AppImage hauria d'empaquetar GStreamer per al vídeo.
          - platform: ubuntu-22.04
            args: "--bundles deb --features native -- --no-default-features"
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependències del sistema (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev             librsvg2-dev patchelf libasound2-dev libssl-dev

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configura Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instal·la dependències del frontend
        run: npm ci

      # Tests de la lògica pura (routing, dispatch, tecles, playlist...). Si
      # fallen, no es construeix cap instal·lador.
      - name: Tests del frontend
        run: npm test

      - name: Build amb Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Perquè el binari arrenqui en macOS Mojave (10.14) i posteriors.
          MACOSX_DEPLOYMENT_TARGET: "10.14"
        with:
          args: ${{ matrix.args }}

      - name: Puja els instal·ladors
        uses: actions/upload-artifact@v4
        with:
          name: ezyplayer-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
